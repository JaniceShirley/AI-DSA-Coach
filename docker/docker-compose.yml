version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=dsa_coach
      - DB_USER=dsa_user
      - DB_PASSWORD=dsa_password
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=development-secret-key-change-in-prod
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    command: sh -c "python manage.py migrate && python manage.py seed_problems && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dsa_user
      POSTGRES_PASSWORD: dsa_password
      POSTGRES_DB: dsa_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
